name: Grade Results

on:
  # Scheduling moved to cron-job.org - GitHub's schedule trigger is
  # best-effort and was firing ~1/16th as often as configured (every few
  # hours instead of every 30 min). Kept here only for manual runs from
  # the Actions tab.
  workflow_dispatch: {}

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the grading endpoint
        run: curl -sf "https://cavepicks.onrender.com/api/grade-results"
