name: Pull Odds

on:
  schedule:
    # All times below are Central (CDT, UTC-5, which covers most of the
    # season). After the early-Nov DST switch to CST (UTC-6) every one of
    # these drifts an hour earlier in local terms - same behavior this file
    # already had before this schedule was expanded, just noting it here
    # since it's not otherwise obvious from a bare UTC cron string.
    #
    # Weekday times (8am/1pm/3pm/6pm) are just periodic "check for a fresh
    # line" pulls. Saturday times are anchored to ~15 min *before* the most
    # common CT kickoff windows' own 30-min auto-lock deadline (11:00am,
    # 2:30/3:00pm, 6:30pm, 7:00-8:00pm, 9:30pm, 10:30pm kickoffs), not to
    # arbitrary round hours - landing a pull exactly on the deadline risks
    # losing a race against the auto-lock-sweep cron (which only checks
    # every 15 min) and locking on the older snapshot anyway.

    # Monday - 1 pull (8:00am)
    - cron: "0 13 * * 1"
    # Tuesday - 3 pulls (8:00am, 1:00pm, 5:00pm)
    - cron: "0 13 * * 2"
    - cron: "0 18 * * 2"
    - cron: "0 22 * * 2"
    # Wednesday - 4 pulls (8:00am, 1:00pm, 3:00pm, 6:00pm)
    - cron: "0 13 * * 3"
    - cron: "0 18 * * 3"
    - cron: "0 20 * * 3"
    - cron: "0 23 * * 3"
    # Thursday - 4 pulls (8:00am, 1:00pm, 3:00pm, 6:00pm)
    - cron: "0 13 * * 4"
    - cron: "0 18 * * 4"
    - cron: "0 20 * * 4"
    - cron: "0 23 * * 4"
    # Friday - 4 pulls (8:00am, 1:00pm, 3:00pm, 6:00pm)
    - cron: "0 13 * * 5"
    - cron: "0 18 * * 5"
    - cron: "0 20 * * 5"
    - cron: "0 23 * * 5"
    # Saturday - 8 pulls (game day): 8:00am check-in, then 10:15am / 1:45pm /
    # 2:45pm / 5:45pm / 6:45pm, all still Saturday UTC-wise
    - cron: "0 13 * * 6"
    - cron: "15 15 * * 6"
    - cron: "45 18 * * 6"
    - cron: "45 19 * * 6"
    - cron: "45 22 * * 6"
    - cron: "45 23 * * 6"
    # ...continuing Saturday night: 8:45pm & 9:45pm CT land on the Sunday
    # UTC calendar day, since UTC is 5 hours ahead of CDT
    - cron: "45 1 * * 0"
    - cron: "45 2 * * 0"
    # No other Sunday pulls
  workflow_dispatch: {} # lets you trigger a pull manually from the Actions tab anytime

jobs:
  pull-odds:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the odds pull endpoint
        run: curl -sf "https://cavepicks.onrender.com/api/pull-odds?type=market"
