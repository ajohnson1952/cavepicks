name: Pull Odds

on:
  # Scheduling moved to cron-job.org (12 jobs replicating this same
  # 24-pulls/week pattern, set directly in America/Chicago so DST is
  # handled natively). GitHub's schedule trigger is best-effort and was
  # firing far less often than configured - kept here only for manual
  # runs from the Actions tab.
  workflow_dispatch: {} # lets you trigger a pull manually from the Actions tab anytime

jobs:
  pull-odds:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the odds pull endpoint
        run: curl -sf "https://cavepicks.onrender.com/api/pull-odds?type=market"
